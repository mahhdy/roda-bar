# fly.toml app config file generated by 'fly launch'
# Visit https://fly.io/docs/reference/configuration/ to learn more about this file.

app = "roda-bar"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"
#  image = "pocketbase/pocketbase:latest"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80
[deploy]
  release_command = "/pb/pocketbase migrate"